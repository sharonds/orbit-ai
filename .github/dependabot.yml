version: 2
updates:
  - package-ecosystem: npm
    # Version-update PRs off: each PR runs paid CI and review. Vulnerabilities
    # still raise Dependabot alerts (email); fix those by hand in a normal PR.
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Amsterdam
    groups:
      development-dependencies:
        dependency-type: development
        patterns:
          - "@types/*"
          - "typescript"
          - "vitest"

  - package-ecosystem: github-actions
    # Version-update PRs off: each PR runs paid CI and review. Vulnerabilities
    # still raise Dependabot alerts (email); fix those by hand in a normal PR.
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Europe/Amsterdam
